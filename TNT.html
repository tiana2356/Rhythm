<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>TNT freight dashboard</title>

    <style>
      :root{
        --bg:#fcfcfb;
        --surf:#f4f3ee;
        --tx:#1f1f1d;
        --mut:#5f5e5a;
        --grid:#e1e0d9;
        --bd:#d9d8d0;
        --c0:#2a78d6;
        --c1:#eb6834;
        --c2:#1baf7a;
        --c3:#eda100;
        --c4:#e87ba4;
        --c5:#008300;
        --c6:#6250d6;
        --c7:#b4b2a9;
        color-scheme:light;
        box-sizing:border-box;
        padding-top:
          env(safe-area-inset-top,0px);
        padding-bottom:
          env(safe-area-inset-bottom,0px)}
      
      @media(prefers-color-scheme:dark){:root:not([data-theme="light"]){
        --bg:#1a1a19;
        --surf:#262624;
        --tx:#ecebe4;
        --mut:#b4b2a9;
        --grid:#33332f;
        --bd:#3d3d3a;
        --c0:#3987e5;
        --c1:#d95926;
        --c2:#199e70;
        --c3:#c98500;
        --c4:#e87ba4;
        --c5:#2fae2f;
        --c6:#9085e9;
        --c7:#898781;
        
        color-scheme:dark}}:root[data-theme="dark"]{
        --bg:#1a1a19;
        --surf:#262624;
        --tx:#ecebe4;
        --mut:#b4b2a9;
        --grid:#33332f;
        --bd:#3d3d3a;
        --c0:#3987e5;
        --c1:#d95926;
        --c2:#199e70;
        --c3:#c98500;
        --c4:#e87ba4;
        --c5:#2fae2f;
        --c6:#9085e9;
        --c7:#898781;
        color-scheme:dark}
      
      html{
        scroll-padding-top:
          env(safe-area-inset-top,0px)}
      body{
        margin:0;
        background:var(--bg);
        color:var(--tx);
        font:14px/1.5 Arial,Helvetica,sans-serif}
      
      .wrap{
        max-width:960px;
        margin:0 auto;
        padding:20px 16px 40px}
      h1{
        font-size:22px;
        margin:0 0 2px}
      h3{
        font-size:14px;
        font-weight:600;
        margin:0 0 6px}
      
      .sub,.note{
        font-size:12px;
        color:
          var(--mut)}
      p.note{
        margin:0 0 10px}
      
      .tiles{
        display:grid;
        grid-template-columns:
          repeat(auto-fit,
                 minmax(130px,1fr));
        gap:12px;
        margin:0 0 16px}
      .tile{
        background:
          var(--surf);
        border-radius:10px;
        padding:14px}
      .tile .l{
        font-size:12px;
        color:
          var(--mut)}
      .tile .v{
        font-size:22px;
        font-weight:600}
      
      .grid{
        display:grid;
        grid-template-columns:
          repeat(auto-fit,
                 minmax(300px,1fr));
        gap:24px;
        margin:0 0 24px}
      .cv{
        position:relative;
        width:100%}
      .leg{
        display:flex;
        flex-wrap:wrap;
        gap:6px 14px;
        font-size:12px;
        color:
          var(--mut);
        margin:0 0 8px}
      .leg span{
        display:flex;
        align-items:center}
      
      .sw{
        width:10px;
        height:10px;
        border-radius:2px;
        display:inline-block;
        margin-right:4px}
      .st{
        font-size:17px;
        font-weight:600;
        border-top:1px 
          solid var(--bd);
        padding-top:20px;
        margin:12px 0}
      .ov{
        overflow-x:auto;
        margin:0 0 24px}
      
      table{
        width:100%;
        border-collapse:collapse;
        font-size:13px}
      td,th{
        padding:5px 0;
        text-align:right;
        border-top:1px 
          solid var(--bd)}
      
      td:first-child,
      th:first-child{
        text-align:left}
      
      th{
        color:
          var(--mut);
        font-weight:400;
        border-top:0}
      
      .strip{
        margin:0 0 18px}
      .bar{
        display:flex;
        height:22px;
        gap:2px}
      .bar div{
        border-radius:3px;
        min-width:3px}
      
      .strip .leg{
        margin:6px 0 0}
    </style>
  </head>
  
  <body>
    <div class="wrap">
      <h1>TNT freight dashboard</h1>
      <p class="sub">
        Rhythm Snow Boards · 1,462 consignments plus debit adjustments
      </p>
      <div id="app">
      </div>
    </div>
        
        <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
        
        <script>
          var S=[
            {t:'tiles',i:[['Shipments','1,462'],['Shipment spend','$160,886'],['All-in spend','$166,801'],['Avg cost','$110.05'],['All-in per shipment','$114.09'],['Avg billed weight','16.7 kg'],['Cost per billed kg','$6.61']]},
            {t:'note',x:'Reconciled to the original file: 1,816 rows = 1,462 shipments + 353 debit adjustments + 1 no-trading row. $166,801.07 = $160,886.37 shipments + $5,914.70 adjustments. Difference: $0.00. All amounts include GST.'},
            {t:'grid',c:[{x:'Share of shipments by state',l:1,id:'c1',h:240,a:'Donut chart of shipments by state: NSW 52%, VIC 25%, QLD 11%, WA 5%, ACT 3%, SA 3%, TAS 1%, NT 0.1%'},{x:'Average cost per shipment (incl. GST)',s:'NT is a single shipment: Rapid Creek (0810) via the DWN depot, 20 kg billed.',id:'c2',h:300,a:'Bar chart of average cost by state, NT $234.74 and WA $212.54 highest, ACT $78.90 lowest'}]},
            {t:'tbl',x:'State summary',r:[['State','Shipments','Avg cost','Avg kg','Total spend'],['NSW','759','$101.35','17.3','$76,927'],['VIC','364','$105.40','14.7','$38,365'],['QLD','157','$117.50','17.0','$18,447'],['WA','73','$212.54','20.3','$15,516'],['ACT','48','$78.90','13.0','$3,787'],['SA','44','$123.22','17.3','$5,422'],['TAS','16','$136.79','18.9','$2,189'],['NT','1','$234.74','20.0','$235'],['<b>Total</b>','<b>1,462</b>','<b>$110.05</b>','<b>16.7</b>','<b>$160,886</b>']]},
            {t:'grid',c:[{x:'Shipments by billed weight band',id:'c3',h:240,a:'Column chart of weight bands, 10 to 20 kg highest with 482'},{x:'Top destination depots',id:'c4',h:240,a:'Column chart of depots led by SYD with 483'}]},
            {t:'grid',c:[{x:'Top 10 destination postcodes',id:'c5',h:300,a:'Bar chart of top postcodes led by 2630 with 17'},{x:'Top 10 destination cities',id:'c8',h:300,a:'Bar chart of top cities'}]},
            {t:'strip',x:'Where the money goes (avg per shipment, $110.05)',id:'b1'},{t:'strip',x:'How shipments were billed',id:'b2'},{t:'strip',x:'Pieces per consignment',id:'b3'},
            {t:'st',x:'Debit adjustments and no-trading'},
            {t:'tiles',i:[['Debit adjustments','353'],['Total incl. GST','$5,914.70'],['Share of spend','3.5%'],['Average','$16.76'],['Per shipment','0.24'],['No-trading rows','1 ($0)']]},
            {t:'strip',x:'Spend split: shipments vs adjustments',id:'b4'},{t:'strip',x:'Adjustment charge: ex-GST vs GST ($5,914.70)',id:'b5'},
            {t:'grid',c:[{x:'Most common adjustment amounts (count)',id:'c6',h:250,a:'Column chart of adjustment amounts, $18.15 most common with 142'},{x:'Invoices with the most adjustments',id:'c7',h:250,a:'Bar chart of invoice weeks, week 3 highest with 57'}]},
            {t:'note',x:'Adjustments appear on 43 of the weekly invoices. $18.15 and $7.15 account for 73% of them (flat charges of $16.50 and $6.50 plus GST). State is derived from receiver postcodes.'}
          ];
          
          function draw(){
            var P=[T.c0,T.c1,T.c2,T.c3,T.c4,T.c5,T.c6,T.c7];
            var sl=['NSW','VIC','QLD','WA','ACT','SA','TAS','NT'];dn('c1',sl,[759,364,157,73,48,44,16,1],P.slice(0,8));
            var cl=['NT (1 shipment)','WA','TAS','SA','QLD','VIC','NSW','ACT'];hb('c2',cl,[234.74,212.54,136.79,123.22,117.5,105.4,101.35,78.9],cl.map(
              function(l){
                return(l=='WA'||l.indexOf('NT')==0)?T.c1:T.c0}),'Average cost ($)',true);        
            col('c3',['0–5 kg','5–10 kg','10–20 kg','20–30 kg','30–50 kg','50+ kg'],[242,307,482,316,74,41],T.c0,'Shipments');         
            col('c4',['SYD','MEL','BNE','CBA','PTH','WNG','VC2','OOL'],[483,250,79,74,57,56,46,45],T.c0,'Shipments');          
            hb('c5',['2630','2026','3741','2229','2074','3142','3723','2230','2101','3068'],[17,13,12,11,11,11,11,9,9,9],T.c0,'Shipments');           
            hb('c8',['Cooma','Toorak','Newport','Glen Iris','Manly','Bright','Castle Hill','Mosman','South Yarra','Mount Buller'],[17,11,10,9,8,8,7,7,7,7],T.c2,'Shipments');           
            strip('b1',[['Freight $81.47',81.47,T.c0],['Surcharge $13.22',13.22,T.c1],['Warranty $5.35',5.35,T.c2],['GST $10.01',10.01,T.c3]]);      
            strip('b2',[['Volume-based 1,125',1125,T.c0],['Actual weight 337',337,T.c1]]);          
            strip('b3',[['1 piece 1,153',1153,T.c0],['2 pieces 296',296,T.c1],['3–4 pieces 13',13,T.c2]]);          
            strip('b4',[['Shipments $160,886',160886.37,T.c0],['Adjustments $5,915',5914.7,T.c1]]);         
            strip('b5',[['Charge ex-GST $5,377.00',5377,T.c1],['GST $537.70',537.7,T.c3]]);           
            col('c6',['$18.15','$7.15','$26.95','$19.80','$7.70','$36.30','$28.60','$69.30','Other'],[142,116,26,24,17,10,5,4,9],T.c1,'Count');
            hb('c7',['Week 3','Week 55','Week 27','Week 28','Week 1','Week 5','Week 53','Week 58'],[57,32,26,22,12,12,11,11],T.c1,'Adjustments');}
          var C=[],T={};
          function $(i){
            return document.getElementById(i)}
          function fm(v,d){
            return '$'+Number(v).toLocaleString('en-AU',{minimumFractionDigits:d||0,maximumFractionDigits:d||0})}
          function tok(){
            var s=getComputedStyle(document.documentElement);['bg','tx','mut','grid','surf','bd','c0','c1','c2','c3','c4','c5','c6','c7'].forEach(
              function(k){T[k]=s.getPropertyValue('--'+k).trim()});Chart.defaults.font.size=12;Chart.defaults.color=T.mut}
          function mk(id,cfg){C.push(new Chart($(id),cfg))}
          function col(id,lb,d,cl,yt,money,tip){mk(id,{type:'bar',data:{labels:lb,datasets:[{data:d,backgroundColor:cl,borderRadius:3}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:
            function(c){
              return tip?tip(c):(money?fm(c.parsed.y,2):c.parsed.y)}}}},scales:{y:{grid:{color:T.grid},title:{display:true,text:yt},ticks:{callback:
            function(v){
              return money?fm(v):v}}},x:{grid:{display:false},ticks:{maxRotation:60,autoSkip:false}}}}})}
          function hb(id,lb,d,cl,xt,money){mk(id,{type:'bar',data:{labels:lb,datasets:[{data:d,backgroundColor:cl,borderRadius:3,barThickness:18}]},options:{indexAxis:'y',responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:
            function(c){
              return money?fm(c.parsed.x,2):c.parsed.x}}}},scales:{x:{grid:{color:T.grid},title:{display:true,text:xt},ticks:{callback:
            function(v){
              return money?fm(v):v}}},y:{grid:{display:false}}}}})}

          function dn(id,lb,v,cl,money){
            var t=v.reduce(
            function(a,b){
              return a+b},0);$(id+'L').innerHTML=lb.map(
            function(l,i){
              return '<span>
                <i class="sw" style="background:'+cl[i]+'"></i>'+l+' '+(v[i]/t*100).toFixed(1)+'%</span>'}).join('');mk(id,{type:'doughnut',data:{labels:lb,datasets:[{data:v,backgroundColor:cl,borderColor:T.bg,borderWidth:2}]},options:{responsive:true,maintainAspectRatio:false,cutout:'60%',plugins:{legend:{display:false},tooltip:{callbacks:{label:
              function(c){
                return c.label+': '+(money?fm(c.parsed):c.parsed.toLocaleString())}}}}}})}
          function strip(id,it){
            var t=it.reduce(
            function(a,b){
              return a+b[1]},0);$(id).innerHTML='<div class="bar">'+it.map(
              function(x){
                return '<div style="flex:'+x[1]+';background:'+x[2]+'"></div>'}).join('')+'</div><div class="leg">'+it.map(
              function(x){
                return '<span><i class="sw" style="background:'+x[2]+'"></i>'+x[0]+' '+(x[1]/t*100).toFixed(1)+'%</span>'}).join('')+'</div>'}
          function render(){
            var h='';S.forEach(
              function(b){
                if(b.t=='tiles')h+='<div class="tiles">'+b.i.map(
                  function(x){
                    return '<div class="tile"><div class="l">'+x[0]+'</div><div class="v">'+x[1]+'</div></div>'}).join('')+'</div>';

          else if(b.t=='note')h+='<p class="note">'+b.x+'</p>';
          else if(b.t=='st')h+='<div class="st">'+b.x+'</div>';
          else if(b.t=='strip')h+='<h3>'+b.x+'</h3><div id="'+b.id+'" class="strip"></div>';
          else if(b.t=='tbl')h+='<h3>'+b.x+'</h3><div class="ov"><table><tr>'+b.r[0].map(
            function(c){
              return '<th>'+c+'</th>'}).join('')+'</tr>'+b.r.slice(1).map(
            function(r){
              return '<tr>'+r.map(
                function(c){
                  return '<td>'+c+'</td>'}).join('')+'</tr>'}).join('')+'</table></div>';
          else if(b.t=='grid')h+='<div class="grid">'+b.c.map(
            function(c){
              return '<div><h3>'+c.x+'</h3>'+(c.s?'<div class="sub">'+c.s+'</div>':'')+(c.l?'<div class="leg" id="'+c.id+'L"></div>':'')+'<div class="cv" style="height:'+(c.h||250)+'px"><canvas id="'+c.id+'" role="img" aria-label="'+c.a+'"></canvas></div></div>'}).join('')+'</div>'});$('app').innerHTML=h}
          function boot(){tok();C.forEach(
            function(c){c.destroy()});C=[];draw()}
          render();boot();matchMedia('(prefers-color-scheme: dark)').addEventListener('change',boot);
        </script>
      </body>
</html>
