<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TNT shipping map</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<style>
:root{--bg:#fcfcfb;--surf:#f4f3ee;--tx:#1f1f1d;--mut:#5f5e5a;--bd:#d9d8d0;--ac:#2a78d6;--dot:#eb6834;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root{--bg:#1a1a19;--surf:#262624;--tx:#ecebe4;--mut:#b4b2a9;--bd:#3d3d3a;--ac:#3987e5;--dot:#d95926;color-scheme:dark}}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.5 Arial,Helvetica,sans-serif}
.wrap{max-width:1000px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:22px;margin:0 0 2px}
.sub,.note{font-size:12px;color:var(--mut)}
p.note{margin:0 0 10px}
a{color:var(--ac)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin:0 0 14px}
.tile{background:var(--surf);border-radius:10px;padding:14px}
.tile .l{font-size:12px;color:var(--mut)}
.tile .v{font-size:22px;font-weight:600}
.tools{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin:0 0 10px;font-size:13px}
.tools select,.tools button{font:inherit;font-size:13px;color:var(--tx);background:var(--surf);border:1px solid var(--bd);border-radius:8px;padding:6px 10px;cursor:pointer}
.tools button:hover,.tools button:focus{border-color:var(--ac)}
#map{height:62vh;min-height:360px;border:1px solid var(--bd);border-radius:12px}
</style>
</head>
<body>
<div class="wrap">
  <h1>TNT shipping map</h1>
  <p class="sub">Where parcels have been sent, built from the TNT data file</p>
  <p class="note"><a href="index.html">All dashboards</a> · <a href="TNT.html">TNT dashboard</a> · <a href="TNT_Upload.html">Add data</a></p>
  <div class="tiles" id="tiles"></div>
  <div class="tools">
    <label>Size dots by
      <select id="metric"><option value="n">Shipments</option><option value="t">Spend (incl. GST)</option></select>
    </label>
    <button id="place" type="button" hidden></button>
  </div>
  <p class="note" id="msg">Loading…</p>
  <div id="map"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="TNT-data.js"></script>
<script>
(function(){
var $=function(i){return document.getElementById(i)};
var COORDS_FILE='postcode-coords.json',LS='rhythm-postcodes';
var COORDS={},MISSING={},AGG=[],metric='n',busy=false,fitted=false;

function pc(v){var s=String(v||'').replace(/\D/g,'');return s?s.padStart(4,'0').slice(-4):''}
function fm(v){return '$'+Number(v).toLocaleString('en-AU',{maximumFractionDigits:0})}
function msg(t,err){var m=$('msg');m.textContent=t;m.style.color=err?'#c0392b':''}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}

/* ---- map ---- */
var map=L.map('map',{preferCanvas:true}).setView([-28,134],4);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:18,attribution:'&copy; OpenStreetMap contributors'}).addTo(map);
var layer=L.layerGroup().addTo(map);

/* ---- aggregate shipments by receiver postcode ---- */
function aggregate(rows){
  var by={};
  rows.forEach(function(r){
    var p=pc(r['Receiver Postcode']);
    if(!p)return;
    var o=by[p]||(by[p]={pc:p,n:0,t:0,cities:{}});
    o.n++;o.t+=TNT.num(r['Total Amount']);
    var c=String(r['Receiver City']||'').trim();
    if(c)o.cities[c]=(o.cities[c]||0)+1;
  });
  return Object.keys(by).map(function(k){
    var o=by[k],cs=Object.keys(o.cities).sort(function(a,b){return o.cities[b]-o.cities[a]});
    o.city=cs[0]||'';
    return o;
  });
}

/* ---- draw ---- */
function render(){
  layer.clearLayers();
  var shown=AGG.filter(function(a){return COORDS[a.pc]});
  var max=Math.max.apply(null,shown.map(function(a){return a[metric]}).concat([1]));
  var dot=getComputedStyle(document.documentElement).getPropertyValue('--dot').trim()||'#eb6834';
  var pts=[];
  shown.forEach(function(a){
    var ll=COORDS[a.pc];pts.push(ll);
    L.circleMarker(ll,{radius:4+Math.sqrt(a[metric]/max)*22,color:dot,weight:1,fillColor:dot,fillOpacity:.45})
     .bindPopup('<b>'+esc(a.city||'Postcode')+' '+a.pc+'</b><br>'+a.n.toLocaleString()+' shipment'+(a.n==1?'':'s')+'<br>'+fm(a.t)+' incl. GST')
     .addTo(layer);
  });
  if(pts.length&&!fitted){map.fitBounds(L.latLngBounds(pts).pad(.1));fitted=true}
  var unplaced=AGG.length-shown.length;
  var tot=AGG.reduce(function(s,a){return s+a.n},0),spend=AGG.reduce(function(s,a){return s+a.t},0);
  $('tiles').innerHTML=
    tile('Shipments',tot.toLocaleString())+tile('Total incl. GST',fm(spend))+
    tile('Postcodes',AGG.length.toLocaleString())+tile('Shown on map',shown.length.toLocaleString());
  var btn=$('place'),todo=AGG.filter(function(a){return!COORDS[a.pc]&&!MISSING[a.pc]}).length;
  if(TNT.ok()&&todo&&!busy){
    btn.hidden=false;
    btn.textContent='Place '+todo+' new postcode'+(todo==1?'':'s')+' ('+Math.ceil(todo*1.1/60)+' min) and save';
  }else if(!busy){btn.hidden=true}
  return unplaced;
}
function tile(l,v){return '<div class="tile"><div class="l">'+l+'</div><div class="v">'+v+'</div></div>'}

/* ---- coordinates: repo file + this browser's cache ---- */
function loadCoords(){
  var local={};
  try{local=JSON.parse(localStorage.getItem(LS)||'{}')}catch(e){}
  return fetch(COORDS_FILE,{cache:'no-store'}).then(function(r){return r.ok?r.json():{}}).catch(function(){return{}})
    .then(function(file){COORDS=Object.assign({},local,file)});
}
function saveLocal(){try{localStorage.setItem(LS,JSON.stringify(COORDS))}catch(e){}}

/* ---- geocoding (site owner only: needs the GitHub token from the upload page) ---- */
function geocode(p){
  return fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=au&postalcode='+p)
    .then(function(r){if(!r.ok)throw new Error('Geocoder returned '+r.status);return r.json()})
    .then(function(j){
      if(!j.length)return null;
      var la=+j[0].lat,lo=+j[0].lon;
      if(!(la<-9&&la>-45&&lo>112&&lo<155))return null;
      return[+la.toFixed(4),+lo.toFixed(4)];
    });
}
function sleep(ms){return new Promise(function(r){setTimeout(r,ms)})}

function ghUrl(c){return'https://api.github.com/repos/'+encodeURIComponent(c.owner)+'/'+encodeURIComponent(c.repo)+'/contents/'+COORDS_FILE}
function ghHead(c){return{Authorization:'Bearer '+c.token,Accept:'application/vnd.github+json'}}
function saveRemote(){
  var c=TNT.cfg(),q='?ref='+encodeURIComponent(c.branch||'main');
  return fetch(ghUrl(c)+q,{headers:ghHead(c),cache:'no-store'}).then(function(r){
    if(r.status==404)return{data:{},sha:null};
    if(!r.ok)throw new Error('Reading '+COORDS_FILE+' failed ('+r.status+')');
    return r.json().then(function(j){return{data:JSON.parse(atob(j.content.replace(/\s/g,''))||'{}'),sha:j.sha}});
  }).then(function(cur){
    var merged=Object.assign({},cur.data,COORDS);
    var keys=Object.keys(merged).sort();
    var text='{\n'+keys.map(function(k){return'"'+k+'":['+merged[k][0]+','+merged[k][1]+']'}).join(',\n')+'\n}\n';
    var body={message:'Update postcode coordinates ('+keys.length+')',content:btoa(text),branch:c.branch||'main'};
    if(cur.sha)body.sha=cur.sha;
    return fetch(ghUrl(c),{method:'PUT',headers:ghHead(c),body:JSON.stringify(body)}).then(function(r){
      if(!r.ok)throw new Error('Saving '+COORDS_FILE+' failed ('+r.status+')');
    });
  });
}

async function placeAll(){
  if(busy)return;
  var todo=AGG.filter(function(a){return!COORDS[a.pc]&&!MISSING[a.pc]}).map(function(a){return a.pc});
  if(!todo.length)return;
  busy=true;$('place').hidden=true;
  var done=0,stop=false;
  for(var i=0;i<todo.length&&!stop;i++){
    try{
      var ll=await geocode(todo[i]);
      if(ll)COORDS[todo[i]]=ll;else MISSING[todo[i]]=1;
    }catch(e){
      MISSING[todo[i]]=1;
      if(/ 4\d\d/.test(e.message)){stop=true;msg(e.message+'. Stopped; run it again later to carry on.',1)}
    }
    done++;
    if(!stop)msg('Placing postcodes… '+done+' of '+todo.length+'. Keep this page open.');
    if(done%20==0){render();saveLocal()}
    await sleep(1100);
  }
  saveLocal();busy=false;render();
  try{
    await saveRemote();
    msg('Saved '+Object.keys(COORDS).length+' postcode locations to '+COORDS_FILE+'. Other visitors will see them once your site redeploys (about a minute).');
  }catch(e){
    msg(e.message+'. Locations are kept in this browser, so run it again to retry the save.',1);
  }
}

/* ---- start ---- */
$('metric').addEventListener('change',function(){metric=this.value;render()});
$('place').addEventListener('click',placeAll);
Promise.all([TNT.load(),loadCoords()]).then(function(res){
  var o=res[0];
  AGG=aggregate(o.rows);
  var unplaced=render();
  if(o.err)msg('Could not load the data file ('+o.err+'). Showing sample rows only.',1);
  else if(unplaced&&!TNT.ok())msg(unplaced+' postcode'+(unplaced==1?'':'s')+' not placed on the map yet. They appear after the site owner places them (open this page with GitHub saving set up on the upload page).');
  else if(unplaced)msg(unplaced+' postcode'+(unplaced==1?'':'s')+' not placed on the map yet. Use the button above to place them.');
  else msg('');
}).catch(function(e){msg(e.message,1)});
})();
</script>
</body>
</html>
