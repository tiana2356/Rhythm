else if(b.t=='strip')h+='<h3>'+b.x+'</h3><div id="'+b.id+'" class="strip"></div>';
else if(b.t=='tbl')h+='<h3>'+b.x+'</h3><div class="ov"><table><tr>'+b.r[0].map(function(c){return '<th>'+c+'</th>'}).join('')+'</tr>'+b.r.slice(1).map(function(r){return '<tr>'+r.map(function(c){return '<td>'+c+'</td>'}).join('')+'</tr>'}).join('')+'</table></div>';
else if(b.t=='grid')h+='<div class="grid">'+b.c.map(function(c){return '<div><h3>'+c.x+'</h3>'+(c.s?'<div class="sub">'+c.s+'</div>':'')+(c.l?'<div class="leg" id="'+c.id+'L"></div>':'')+'<div class="cv" style="height:'+(c.h||250)+'px"><canvas id="'+c.id+'" role="img" aria-label="'+c.a+'"></canvas></div></div>'}).join('')+'</div>'});$('app').innerHTML=h}
function boot(){tok();C.forEach(function(c){c.destroy()});C=[];draw()}
render();boot();loadSaved();matchMedia('(prefers-color-scheme: dark)').addEventListener('change',boot);
</script></body></html>
