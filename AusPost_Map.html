<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AusPost shipping map</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<style>
:root{--bg:#fcfcfb;--surf:#f4f3ee;--tx:#1f1f1d;--mut:#5f5e5a;--bd:#d9d8d0;--ac:#2a78d6;--dot:#eb6834;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root{--bg:#1a1a19;--surf:#262624;--tx:#ecebe4;--mut:#b4b2a9;--bd:#3d3d3a;--ac:#3987e5;--dot:#d95926;color-scheme:dark}}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.5 Arial,Helvetica,sans-serif}
.wrap{max-width:1000px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:22px;margin:0 0 2px}
.sub,.note{font-size:12px;color:var(--mut)}
p.note{margin:0 0 10px}
a{color:var(--ac)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin:0 0 14px}
.tile{background:var(--surf);border-radius:10px;padding:14px}
.tile .l{font-size:12px;color:var(--mut)}
.tile .v{font-size:22px;font-weight:600}
.tools{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin:0 0 10px;font-size:13px}
.tools select,.tools button{font:inherit;font-size:13px;color:var(--tx);background:var(--surf);border:1px solid var(--bd);border-radius:8px;padding:6px 10px;cursor:pointer}
.tools button:hover,.tools button:focus{border-color:var(--ac)}
#map{height:62vh;min-height:360px;border:1px solid var(--bd);border-radius:12px}
</style>
</head>
<body>
<div class="wrap">
  <h1>AusPost shipping map</h1>
  <p class="sub">Where parcels have been sent, built from the AusPost data file</p>
  <p class="note"><a href="index.html">All dashboards</a> · <a href="AusPost.html">AusPost dashboard</a> · <a href="AusPost_Upload.html">Add data</a></p>
  <div class="tiles" id="tiles"></div>
  <div class="tools">
    <label>Size dots by
      <select id="metric"><option value="n">Shipments</option><option value="t">Spend (incl. GST)</option></select>
    </label>
    <button id="place" type="button" hidden></button>
  </div>
  <p class="note" id="msg">Loading…</p>
  <div id="map"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
/* Shared data layer for AusPost.html (graphs) and AusPost_Upload.html (adding data).
   Data lives in auspost-data.csv in the repo. Saving uses the GitHub API with a token kept in this browser. */
(function(){
var DATA='auspost-data.csv',SEED="INVOICE NO,BILLING DOC,ITEM,BILLING DATE,SERVICE DATE,WORK CENTRE NAME,DESCRIPTION,AMOUNT INCL TAX,TAX AMOUNT,AMOUNT EXCL TAX,CONSIGNMENT ID,ARTICLE ID,TO CITY,TO STATE,TO POSTAL CODE,RECEIVING COUNTRY,FROM CITY,BILLED WEIGHT,ACTUAL WEIGHT,CUBIC WEIGHT,QTY\n1014364063,6013052544, 000101,20251110,20251110,COOMA POST SHOP,Parcel Post with Signature,25.39,2.31,23.08,J7Y0211383,J7Y021138301000930308,HARRIETVILLE,VIC,3741,AU,COOMA,3.8,3.8,0,1\n1014364063,6013052544, 000201,20251110,20251110,COOMA POST SHOP,Parcel Post with Signature,26.09,2.37,23.72,J7Y0211387,J7Y021138701000930306,MODBURY HEIGHTS,SA,5092,AU,COOMA,3.25,3.25,0,1\n1014364063,6013052544, 000301,20251110,20251110,COOMA POST SHOP,Parcel Post with Signature,27.34,2.49,24.85,J7Y0211389,J7Y021138901000930300,PALMYRA,WA,6157,AU,COOMA,1.6,0.75,0,1\n1014364063,6013052544, 000401,20251110,20251110,COOMA POST SHOP,Parcel Post with Signature,14.76,1.34,13.42,J7Y0211392,J7Y021139201000930300,PADDINGTON,NSW,2021,AU,COOMA,1,0,0.125,1\n1014364063,6013052544, 000501,20251110,20251110,COOMA POST SHOP,Parcel Post with Signature,19.83,1.8,18.03,J7Y0211428,J7Y021142801000930306,NUNDAH,QLD,4012,AU,COOMA,2,2,5.758,1\n1014364063,6013052544, 000601,20251110,20251110,COOMA POST SHOP,Parcel Post with Signature,15.31,1.39,13.92,J7Y0211431,J7Y021143101000930306,FAIRY MEADOW,NSW,2519,AU,COOMA,0.95,0.95,0,1\n1014364063,6013052544, 000701,20251110,20251110,COOMA POST SHOP,Parcel Post with Signature,32.55,2.96,29.59,J7Y0211432,J7Y021143201000930303,BICTON,WA,6157,AU,COOMA,2.8,2.8,0,1\n1014364063,6013052544, 000801,20251110,20251110,COOMA POST SHOP,Parcel Post with Signature,11.26,1.02,10.24,J7Y0211436,J7Y021143601000930301,ALICE SPRINGS,NT,0870,AU,COOMA,0.25,0.25,0,1\n1014364063,6013052544, 000901,20251110,20251110,COOMA POST SHOP,Parcel Post with Signature,9.6,0.87,8.73,J7Y0211437,J7Y021143701000930308,BRIDPORT,TAS,7262,AU,COOMA,0.3,0.3,0,1\n1014364063,6013052544, 001001,20251110,20251110,COOMA POST SHOP,Parcel Post with Signature,10.76,0.98,9.78,J7Y0211439,J7Y021143901000930302,NOOSAVILLE,QLD,4566,AU,COOMA,0.25,0.25,0,1\n1014364063,6013052544, 001201,20251110,20251110,COOMA POST SHOP,Parcel Post with Signature,17.63,1.6,16.03,J7Y0211443,J7Y021144301000930309,CARRUM DOWNS,VIC,3201,AU,COOMA,0.85,0.85,0,1\n1014364063,6013052544, 001301,20251110,20251110,COOMA POST SHOP,Parcel Post with Signature,17.64,1.6,16.04,J7Y0211444,J7Y021144401000930306,GOBBAGOMBALIN,NSW,2650,AU,COOMA,1.5,0,0,1\n1014364063,6013052544, 001401,20251110,20251110,COOMA POST SHOP,Parcel Post with Signature,19.98,1.82,18.16,J7Y0211446,J7Y021144601000930300,TENERIFFE,QLD,4005,AU,COOMA,1.15,1.15,0,1\n1014364063,6013052544, 001501,20251110,20251110,COOMA POST SHOP,Parcel Post with Signature,59.17,5.38,53.79,J7Y0211448,J7Y021144801000930304,WOOLNER,NT,0820,AU,COOMA,5.8,5.8,0,1\n1014364063,6013052544, 003100,20251110,20251110,COOMA POST SHOP,AP Parcels Domestic Fuel Surcharge,31.01,2.82,28.19,,,,,,,,0,0,0,0\n",CFG={};
try{CFG=JSON.parse(localStorage.getItem('rhythm-gh')||'{}')}catch(e){}
function num(v){if(typeof v=='number')return v;var x=parseFloat(String(v).replace(/[$,\s]/g,''));return isNaN(x)?0:x}
function csv(t){var r=[],row=[],f='',q=0,i=0,c;for(;i<t.length;i++){c=t[i];if(q){if(c=='"'){if(t[i+1]=='"'){f+='"';i++}else q=0}else f+=c}else if(c=='"')q=1;else if(c==','){row.push(f);f=''}else if(c=='\n'||c=='\r'){if(c=='\r'&&t[i+1]=='\n')i++;row.push(f);r.push(row);row=[];f=''}else f+=c}if(f!==''||row.length){row.push(f);r.push(row)}var h=r.shift().map(function(x){return x.trim()});return r.filter(function(x){return x.length>1||x[0]}).map(function(x){var o={};h.forEach(function(k,j){o[k]=x[j]===undefined?'':x[j]});return o})}
var REQ=['TO CITY','TO POSTAL CODE','AMOUNT INCL TAX','BILLED WEIGHT','DESCRIPTION'];
function KEY(r){return[String(r['INVOICE NO']).trim(),String(r['BILLING DOC']).trim(),String(parseInt(r['ITEM'])||''),String(r['ARTICLE ID']).trim(),num(r['AMOUNT INCL TAX']).toFixed(2)].join('|')}
function cfgSet(c){CFG=c||{};try{localStorage.setItem('rhythm-gh',JSON.stringify(CFG))}catch(e){}}
function ok(){return!!(CFG.owner&&CFG.repo&&CFG.token)}
function ghUrl(){return'https://api.github.com/repos/'+encodeURIComponent(CFG.owner)+'/'+encodeURIComponent(CFG.repo)+'/contents/'+DATA}
function ghHead(a){return{Authorization:'Bearer '+CFG.token,Accept:a||'application/vnd.github+json'}}
function fail(r,what){return r.text().then(function(t){var m='';try{m=JSON.parse(t).message}catch(e){}var e=new Error(what+' failed ('+r.status+(m?': '+m:'')+')');e.status=r.status;throw e})}
function b2t(b){var s=atob(b.replace(/\s/g,'')),u=new Uint8Array(s.length);for(var i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return new TextDecoder().decode(u)}
function t2b(t){var u=new TextEncoder().encode(t),s='';for(var i=0;i<u.length;i+=32768)s+=String.fromCharCode.apply(null,u.subarray(i,i+32768));return btoa(s)}
function ghRead(){var q='?ref='+encodeURIComponent(CFG.branch||'main');return fetch(ghUrl()+q,{headers:ghHead(),cache:'no-store'}).then(function(r){if(r.status==404)return{text:'',sha:null};if(!r.ok)return fail(r,'Reading '+DATA);return r.json().then(function(j){if(j.content&&j.encoding=='base64')return{text:b2t(j.content),sha:j.sha};return fetch(ghUrl()+q,{headers:ghHead('application/vnd.github.raw+json'),cache:'no-store'}).then(function(r2){if(!r2.ok)return fail(r2,'Reading '+DATA);return r2.text().then(function(t){return{text:t,sha:j.sha}})})})})}
function ghWrite(text,sha,message){var body={message:message,content:t2b(text),branch:CFG.branch||'main'};if(sha)body.sha=sha;return fetch(ghUrl(),{method:'PUT',headers:ghHead(),body:JSON.stringify(body)}).then(function(r){if(!r.ok)return fail(r,'Saving '+DATA);return r.json()})}
function clean(r){var o={};Object.keys(r).forEach(function(k){var v=r[k];o[String(k).trim()]=typeof v=='string'?v.trim():v});return o}
function fmtD(v){if(v instanceof Date&&!isNaN(v))return String(v.getFullYear())+String(v.getMonth()+1).padStart(2,'0')+String(v.getDate()).padStart(2,'0');return v}
function parseText(t){return t?csv(String(t).replace(/^\uFEFF/,'')).map(clean):[]}
function merge(base,incoming){var seen={},rows=[],add=0,dup=0;base.forEach(function(r){var k=KEY(r);if(!seen[k]){seen[k]=1;rows.push(r)}});incoming.forEach(function(r){var k=KEY(r);if(seen[k]){dup++;return}seen[k]=1;rows.push(r);add++});return{rows:rows,added:add,dups:dup}}
function toCsv(rows){var h=[],hs={};rows.forEach(function(r){Object.keys(r).forEach(function(k){if(!hs[k]){hs[k]=1;h.push(k)}})});function q(v){v=v===undefined||v===null?'':String(fmtD(v));return/[",\r\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}return[h.map(q).join(',')].concat(rows.map(function(r){return h.map(function(k){return q(r[k])}).join(',')})).join('\r\n')+'\r\n'}
function seedRows(){return merge([],parseText(SEED)).rows}
function staticRead(){return fetch(DATA,{cache:'no-store'}).then(function(r){if(!r.ok)throw new Error(DATA+' could not be loaded ('+r.status+')');return r.text().then(parseText)})}
/* load(): resolves {rows, err}. err is set when the built-in sample rows are being shown instead of auspost-data.csv. */
function load(){var p=ok()?ghRead().then(function(c){return parseText(c.text)}).catch(function(e){return staticRead().catch(function(){throw e})}):staticRead();
return p.then(function(rows){return{rows:merge([],rows).rows}},function(e){return{rows:[],err:e.message}}).then(function(o){if(!o.rows.length){o.rows=seedRows();o.err=o.err||DATA+' is empty'}if(o.err&&location.protocol=='file:')o.err+=' (open this page from your website, not as a local file)';return o})}
/* add(newRows, shown): merge into the saved file. Resolves {rows, added, dups, saved, err}. */
function add(all,shown,tries){if(!ok()){var m=merge(shown||[],all);return Promise.resolve({rows:m.rows,added:m.added,dups:m.dups,saved:false})}
return ghRead().then(function(c){var m=merge(parseText(c.text),all);if(!m.added)return{rows:m.rows,added:0,dups:m.dups,saved:true};return ghWrite(toCsv(m.rows),c.sha,'Add '+m.added+' AusPost rows').then(function(){return{rows:m.rows,added:m.added,dups:m.dups,saved:true}})}).catch(function(e){if((e.status==409||e.status==422)&&!tries)return add(all,shown,1);var m=merge(shown||[],all);return{rows:m.rows,added:m.added,dups:m.dups,saved:false,err:e.message}})}
function readFiles(files){files=Array.from(files);return Promise.all(files.map(function(f){return new Promise(function(res,no){var r=new FileReader(),isCsv=/\.csv$/i.test(f.name);r.onload=function(e){try{if(isCsv)res(csv(String(e.target.result).replace(/^\uFEFF/,'')));else{if(!window.XLSX)throw new Error('the Excel reader did not load');var wb=XLSX.read(e.target.result,{type:'array',cellDates:true});res(XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:''}))}}catch(x){no(new Error(f.name+': '+x.message))}};r.onerror=function(){no(new Error(f.name+' could not be read'))};if(isCsv)r.readAsText(f);else r.readAsArrayBuffer(f)})})).then(function(a){return[].concat.apply([],a).map(clean)})}
function download(rows){if(!rows.length)return;var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([toCsv(rows)],{type:'text/csv'}));a.download=DATA;document.body.appendChild(a);a.click();a.remove()}
/* Row type: 'ret' = parcel returned to Cooma or to sender, 'ship' = anything lodged with a consignment or destination, 'adj' = surcharges, fees and credits */
function kind(r){var d=String(r['DESCRIPTION']||'').trim();if(/^eParcel\s+(Post Return|Return To Sender)/i.test(d))return'ret';if(String(r['CONSIGNMENT ID']||'').trim()||String(r['TO CITY']||'').trim())return'ship';return'adj'}
function intl(r){var c=String(r['RECEIVING COUNTRY']||'').trim().toUpperCase();return!!c&&c!='AU'}
window.AP={kind:kind,intl:intl,DATA:DATA,REQ:REQ,KEY:KEY,num:num,csv:csv,fmtD:fmtD,cfg:function(){return CFG},cfgSet:cfgSet,ok:ok,load:load,add:add,readFiles:readFiles,download:download,toCsv:toCsv,parseText:parseText,merge:merge};
})();

</script>
<script>
(function(){
var $=function(i){return document.getElementById(i)};
var COORDS_FILE='postcode-coords.json',LS='rhythm-postcodes';
var INTL=0,COORDS={},MISSING={},AGG=[],metric='n',busy=false,fitted=false;

function pc(v){var s=String(v||'').replace(/\D/g,'');return s?s.padStart(4,'0').slice(-4):''}
function fm(v){return '$'+Number(v).toLocaleString('en-AU',{maximumFractionDigits:0})}
function msg(t,err){var m=$('msg');m.textContent=t;m.style.color=err?'#c0392b':''}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}

/* ---- map ---- */
var map=L.map('map',{preferCanvas:true}).setView([-28,134],4);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:18,attribution:'&copy; OpenStreetMap contributors'}).addTo(map);
var layer=L.layerGroup().addTo(map);

/* ---- aggregate outbound shipments by destination postcode (returns, fees and international parcels excluded) ---- */
function aggregate(rows){
  var by={};INTL=0;
  rows.forEach(function(r){
    if(AP.kind(r)!='ship')return;
    if(AP.intl(r)){INTL++;return}
    var s=String(r['TO POSTAL CODE']||'').replace(/\D/g,'');
    if(!s||s.length>4)return;
    var p=pc(s);
    var o=by[p]||(by[p]={pc:p,n:0,t:0,cities:{}});
    o.n++;o.t+=AP.num(r['AMOUNT INCL TAX']);
    var c=String(r['TO CITY']||'').trim();
    if(c)o.cities[c]=(o.cities[c]||0)+1;
  });
  return Object.keys(by).map(function(k){
    var o=by[k],cs=Object.keys(o.cities).sort(function(a,b){return o.cities[b]-o.cities[a]});
    o.city=cs[0]||'';
    return o;
  });
}

/* ---- draw ---- */
function render(){
  layer.clearLayers();
  var shown=AGG.filter(function(a){return COORDS[a.pc]});
  var max=Math.max.apply(null,shown.map(function(a){return a[metric]}).concat([1]));
  var dot=getComputedStyle(document.documentElement).getPropertyValue('--dot').trim()||'#eb6834';
  var pts=[];
  shown.forEach(function(a){
    var ll=COORDS[a.pc];pts.push(ll);
    L.circleMarker(ll,{radius:4+Math.sqrt(a[metric]/max)*22,color:dot,weight:1,fillColor:dot,fillOpacity:.45})
     .bindPopup('<b>'+esc(a.city||'Postcode')+' '+a.pc+'</b><br>'+a.n.toLocaleString()+' shipment'+(a.n==1?'':'s')+'<br>'+fm(a.t)+' incl. GST')
     .addTo(layer);
  });
  if(pts.length&&!fitted){map.fitBounds(L.latLngBounds(pts).pad(.1));fitted=true}
  var unplaced=AGG.length-shown.length;
  var tot=AGG.reduce(function(s,a){return s+a.n},0),spend=AGG.reduce(function(s,a){return s+a.t},0);
  $('tiles').innerHTML=
    tile('Shipments',tot.toLocaleString())+tile('Total incl. GST',fm(spend))+
    tile('Postcodes',AGG.length.toLocaleString())+tile('Shown on map',shown.length.toLocaleString())+(INTL?tile('International (not mapped)',INTL.toLocaleString()):'');
  var btn=$('place'),todo=AGG.filter(function(a){return!COORDS[a.pc]&&!MISSING[a.pc]}).length;
  if(AP.ok()&&todo&&!busy){
    btn.hidden=false;
    btn.textContent='Place '+todo+' new postcode'+(todo==1?'':'s')+' ('+Math.ceil(todo*1.1/60)+' min) and save';
  }else if(!busy){btn.hidden=true}
  return unplaced;
}
function tile(l,v){return '<div class="tile"><div class="l">'+l+'</div><div class="v">'+v+'</div></div>'}

/* ---- coordinates: repo file + this browser's cache ---- */
function loadCoords(){
  var local={};
  try{local=JSON.parse(localStorage.getItem(LS)||'{}')}catch(e){}
  return fetch(COORDS_FILE,{cache:'no-store'}).then(function(r){return r.ok?r.json():{}}).catch(function(){return{}})
    .then(function(file){COORDS=Object.assign({},local,file)});
}
function saveLocal(){try{localStorage.setItem(LS,JSON.stringify(COORDS))}catch(e){}}

/* ---- geocoding (site owner only: needs the GitHub token from the upload page) ---- */
function geocode(p){
  return fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=au&postalcode='+p)
    .then(function(r){if(!r.ok)throw new Error('Geocoder returned '+r.status);return r.json()})
    .then(function(j){
      if(!j.length)return null;
      var la=+j[0].lat,lo=+j[0].lon;
      if(!(la<-9&&la>-45&&lo>112&&lo<155))return null;
      return[+la.toFixed(4),+lo.toFixed(4)];
    });
}
function sleep(ms){return new Promise(function(r){setTimeout(r,ms)})}

function ghUrl(c){return'https://api.github.com/repos/'+encodeURIComponent(c.owner)+'/'+encodeURIComponent(c.repo)+'/contents/'+COORDS_FILE}
function ghHead(c){return{Authorization:'Bearer '+c.token,Accept:'application/vnd.github+json'}}
function saveRemote(){
  var c=AP.cfg(),q='?ref='+encodeURIComponent(c.branch||'main');
  return fetch(ghUrl(c)+q,{headers:ghHead(c),cache:'no-store'}).then(function(r){
    if(r.status==404)return{data:{},sha:null};
    if(!r.ok)throw new Error('Reading '+COORDS_FILE+' failed ('+r.status+')');
    return r.json().then(function(j){return{data:JSON.parse(atob(j.content.replace(/\s/g,''))||'{}'),sha:j.sha}});
  }).then(function(cur){
    var merged=Object.assign({},cur.data,COORDS);
    var keys=Object.keys(merged).sort();
    var text='{\n'+keys.map(function(k){return'"'+k+'":['+merged[k][0]+','+merged[k][1]+']'}).join(',\n')+'\n}\n';
    var body={message:'Update postcode coordinates ('+keys.length+')',content:btoa(text),branch:c.branch||'main'};
    if(cur.sha)body.sha=cur.sha;
    return fetch(ghUrl(c),{method:'PUT',headers:ghHead(c),body:JSON.stringify(body)}).then(function(r){
      if(!r.ok)throw new Error('Saving '+COORDS_FILE+' failed ('+r.status+')');
    });
  });
}

async function placeAll(){
  if(busy)return;
  var todo=AGG.filter(function(a){return!COORDS[a.pc]&&!MISSING[a.pc]}).map(function(a){return a.pc});
  if(!todo.length)return;
  busy=true;$('place').hidden=true;
  var done=0,stop=false;
  for(var i=0;i<todo.length&&!stop;i++){
    try{
      var ll=await geocode(todo[i]);
      if(ll)COORDS[todo[i]]=ll;else MISSING[todo[i]]=1;
    }catch(e){
      MISSING[todo[i]]=1;
      if(/ 4\d\d/.test(e.message)){stop=true;msg(e.message+'. Stopped; run it again later to carry on.',1)}
    }
    done++;
    if(!stop)msg('Placing postcodes… '+done+' of '+todo.length+'. Keep this page open.');
    if(done%20==0){render();saveLocal()}
    await sleep(1100);
  }
  saveLocal();busy=false;render();
  try{
    await saveRemote();
    msg('Saved '+Object.keys(COORDS).length+' postcode locations to '+COORDS_FILE+'. Other visitors will see them once your site redeploys (about a minute).');
  }catch(e){
    msg(e.message+'. Locations are kept in this browser, so run it again to retry the save.',1);
  }
}

/* ---- start ---- */
$('metric').addEventListener('change',function(){metric=this.value;render()});
$('place').addEventListener('click',placeAll);
Promise.all([AP.load(),loadCoords()]).then(function(res){
  var o=res[0];
  AGG=aggregate(o.rows);
  var unplaced=render();
  if(o.err)msg('Could not load the data file ('+o.err+'). Showing sample rows only.',1);
  else if(unplaced&&!AP.ok())msg(unplaced+' postcode'+(unplaced==1?'':'s')+' not placed on the map yet. They appear after the site owner places them (open this page with GitHub saving set up on the upload page).');
  else if(unplaced)msg(unplaced+' postcode'+(unplaced==1?'':'s')+' not placed on the map yet. Use the button above to place them.');
  else msg('');
}).catch(function(e){msg(e.message,1)});
})();
</script>
