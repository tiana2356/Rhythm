<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rhythm shipping dashboards</title>
<style>
:root{--bg:#fcfcfb;--surf:#f4f3ee;--tx:#1f1f1d;--mut:#5f5e5a;--bd:#d9d8d0;--ac:#2a78d6;color-scheme:light}
@media(prefers-color-scheme:dark){:root{--bg:#1a1a19;--surf:#262624;--tx:#ecebe4;--mut:#b4b2a9;--bd:#3d3d3a;--ac:#3987e5;color-scheme:dark}}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 Arial,Helvetica,sans-serif}
.wrap{max-width:640px;margin:0 auto;padding:48px 16px}
h1{font-size:24px;margin:0 0 4px}
p{color:var(--mut);margin:0 0 28px}
a.card{display:block;background:var(--surf);border:1px solid var(--bd);border-radius:12px;padding:20px;margin:0 0 16px;text-decoration:none;color:inherit}
a.card:hover,a.card:focus{border-color:var(--ac)}
.t{font-size:18px;font-weight:600;color:var(--ac)}
.d{font-size:14px;color:var(--mut);margin-top:4px}
</style>
</head>
<body>
<div class="wrap">
<h1>Shipping dashboards</h1>
<p>Choose a dashboard to open.</p>
<a class="card" href="TNT_Dashboard.html"><div class="t">TNT freight dashboard</div><div class="d">Shipments by state, costs, weights, depots and debit adjustments</div></a>
<a class="card" href="AusPost_Dashboard.html"><div class="t">Australia Post account dashboard</div><div class="d">Charges, returns, retail outlets by state, payments and reconciliation</div></a>
</div>
</body>
</html>
